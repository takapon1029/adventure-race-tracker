<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アドベンチャーレース トラッカー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

#header {
  background: #16213e; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid #0f3460; flex-shrink: 0; flex-wrap: wrap;
}
#header h1 { font-size: 16px; font-weight: 700; color: #e94560; white-space: nowrap; }

.hdr-btn {
  color: white; border: none; padding: 6px 12px; border-radius: 4px;
  cursor: pointer; font-size: 13px; white-space: nowrap; flex-shrink: 0;
}
#load-btn  { background: #e94560; }
#load-btn:hover  { background: #c73652; }
#mode-btn  { background: #0f3460; border: 1px solid #555; }
#mode-btn:hover, #mode-btn.active { background: #1a5276; border-color: #3498db; }
#live-btn  { background: #0f3460; border: 1px solid #555; }
#live-btn:hover   { background: #1e8449; }
#live-btn.active  { background: #27ae60; border-color: #2ecc71; animation: pulse-btn 1.5s infinite; }
#lt360-btn { background: #0f3460; border: 1px solid #555; }
#lt360-btn:hover  { background: #1565c0; }
#lt360-btn.active { background: #1976d2; border-color: #42a5f5; animation: pulse-btn 1.5s infinite; }
@keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.7} }

#file-input { display: none; }
#file-list  { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.file-tag   { background: #0f3460; border-radius: 12px; padding: 2px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.file-tag .remove { cursor: pointer; opacity: 0.6; font-size: 14px; }
.file-tag .remove:hover { opacity: 1; }

#map-wrapper { flex: 1; position: relative; overflow: hidden; }
#map2d, #map3d { position: absolute; inset: 0; }
#map3d { display: none; }

#timeline { background: #16213e; padding: 10px 16px; border-top: 1px solid #0f3460; flex-shrink: 0; }
#time-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
#current-time { font-size: 15px; font-weight: bold; color: #e94560; }
#controls { display: flex; align-items: center; gap: 10px; }
#play-btn  { background: #0f3460; border: none; color: white; width:32px; height:32px; border-radius:4px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#play-btn:hover { background: #e94560; }
#speed-select  { background: #0f3460; border: none; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
#slider { flex: 1; accent-color: #e94560; height: 4px; cursor: pointer; }
#slider:disabled { opacity: 0.4; cursor: default; }

/* Overlays */
#team-legend {
  position: absolute; top: 10px; right: 10px;
  background: rgba(15,22,40,0.92); border-radius: 6px;
  padding: 10px 14px; z-index: 1000; min-width: 160px;
  font-size: 13px; border: 1px solid #0f3460;
}
#team-legend h3 { font-size: 11px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing:.05em; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.legend-line { width: 24px; height: 3px; border-radius: 2px; flex-shrink: 0; }

#elev-panel {
  position: absolute; bottom: 10px; left: 10px;
  background: rgba(15,22,40,0.92); border-radius: 6px;
  padding: 10px 14px; z-index: 1000;
  font-size: 12px; border: 1px solid #0f3460; min-width: 210px; display: none;
}
#elev-panel h3 { font-size: 11px; color: #aaa; margin-bottom: 8px; }
.elev-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; line-height:1.4; }
.elev-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.elev-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.elev-vals { text-align:right; white-space:nowrap; color:#ccc; }
.elev-vals span { color:#fff; font-weight:600; }
.elev-vals .gain { color:#7fff00; }

#live-panel {
  position: absolute; top: 10px; left: 10px;
  background: rgba(15,22,40,0.92); border-radius: 6px;
  padding: 10px 14px; z-index: 1000;
  font-size: 12px; border: 1px solid #27ae60; min-width: 180px; display: none;
}
#live-panel h3 { font-size: 11px; color: #2ecc71; margin-bottom: 8px; }
#live-info { color: #ccc; line-height: 1.7; }
#live-info b { color: #fff; }
.live-pulse {
  display:inline-block; width:10px; height:10px; border-radius:50%;
  background:#e94560; box-shadow:0 0 0 0 rgba(233,69,96,.7);
  animation: pulse-dot 1.4s infinite;
}
@keyframes pulse-dot { 0%{box-shadow:0 0 0 0 rgba(233,69,96,.7)} 70%{box-shadow:0 0 0 10px rgba(233,69,96,0)} 100%{box-shadow:0 0 0 0 rgba(233,69,96,0)} }

/* LT360 dialog */
#lt360-dialog {
  display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(15,22,40,0.96); border-radius: 8px; padding: 14px 16px;
  z-index: 2000; min-width: 320px; max-width: 420px; border: 1px solid #1976d2;
  font-size: 13px;
}
#lt360-dialog h3 { color: #42a5f5; margin-bottom: 10px; font-size: 13px; display:flex; justify-content:space-between; align-items:center; }
#lt360-dialog label { display:block; color:#aaa; margin-bottom:3px; font-size:12px; }
#lt360-dialog input[type=text] {
  width:100%; background:#0a0e1a; border:1px solid #1976d2; border-radius:4px;
  color:#fff; padding:6px 8px; font-size:13px; margin-bottom:10px;
}
#lt360-dialog input[type=text]::placeholder { color:#555; }
.lt360-row { display:flex; gap:8px; }
#lt360-start-btn { flex:1; background:#1976d2; border:none; color:white; padding:7px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
#lt360-start-btn:hover { background:#1565c0; }
#lt360-start-btn.stop { background:#c0392b; }
#lt360-start-btn.stop:hover { background:#a93226; }
#lt360-status { margin-top:8px; font-size:12px; color:#ccc; min-height:18px; }
#lt360-status.error { color:#e74c3c; }
#lt360-status.ok { color:#2ecc71; }

#lt360-panel {
  position: absolute; top: 10px; left: 10px;
  background: rgba(15,22,40,0.92); border-radius: 6px;
  padding: 10px 14px; z-index: 1000;
  font-size: 12px; border: 1px solid #1976d2; min-width: 180px; display: none;
}
#lt360-panel h3 { font-size: 11px; color: #42a5f5; margin-bottom: 8px; }
#lt360-panel-info { color: #ccc; line-height: 1.7; }
.lt360-pulse {
  display:inline-block; width:10px; height:10px; border-radius:50%;
  background:#42a5f5; box-shadow:0 0 0 0 rgba(66,165,245,.7);
  animation: pulse-dot-blue 1.4s infinite;
}
@keyframes pulse-dot-blue { 0%{box-shadow:0 0 0 0 rgba(66,165,245,.7)} 70%{box-shadow:0 0 0 10px rgba(66,165,245,0)} 100%{box-shadow:0 0 0 0 rgba(66,165,245,0)} }

#map3d-controls {
  position: absolute; bottom: 10px; right: 10px;
  z-index: 1000; display: none; gap: 4px; flex-direction: column;
}
.ctrl-btn {
  background: rgba(15,22,40,0.92); border: 1px solid #0f3460;
  color: white; padding: 6px 10px; border-radius: 4px;
  cursor: pointer; font-size: 12px; text-align: center;
}
.ctrl-btn:hover { background: #e94560; border-color:#e94560; }

#drop-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(233,69,96,0.15); border: 3px dashed #e94560;
  z-index: 9999; align-items: center; justify-content: center;
  font-size: 24px; color: #e94560; pointer-events: none;
}
#drop-overlay.active { display: flex; }
</style>
</head>
<body>

<div id="header">
  <h1>🏔 AR Tracker</h1>
  <button id="load-btn" class="hdr-btn" onclick="document.getElementById('file-input').click()">GPXを読み込む</button>
  <input type="file" id="file-input" accept=".gpx" multiple>
  <button id="mode-btn" class="hdr-btn" onclick="toggleMode()">🛰 衛星3D</button>
  <button id="live-btn" class="hdr-btn" onclick="toggleLive()">📍 ライブ</button>
  <button id="lt360-btn" class="hdr-btn" onclick="toggleLT360Dialog()">🌐 LT360</button>
  <div id="file-list"></div>
</div>

<div id="map-wrapper">
  <div id="map2d"></div>
  <div id="map3d"></div>

  <div id="live-panel">
    <h3><span class="live-pulse"></span> &nbsp; リアルタイム追跡中</h3>
    <div id="live-info">待機中...</div>
  </div>

  <div id="lt360-panel">
    <h3><span class="lt360-pulse"></span> &nbsp; LiveTrack360 接続中</h3>
    <div id="lt360-panel-info">接続中...</div>
  </div>

  <div id="lt360-dialog">
    <h3>🌐 LiveTrack360 連携 <span onclick="closeLT360Dialog()" style="cursor:pointer;opacity:0.6;font-size:16px" title="閉じる">✕</span></h3>
    <label>グループID または URL</label>
    <input type="text" id="lt360-input" placeholder="例: 7671 または https://livetrack360.com/livetracking/2d/7671">
    <label>プロキシURL（CORS回避用・省略可）</label>
    <input type="text" id="lt360-proxy" placeholder="例: http://localhost:8766/">
    <div class="lt360-row">
      <button id="lt360-start-btn" onclick="toggleLT360()">▶ 開始</button>
    </div>
    <div id="lt360-status"></div>
  </div>
  <div id="elev-panel"><h3>▲ 標高 / 累積獲得標高</h3><div id="elev-rows"></div></div>
  <div id="team-legend"><h3>チーム</h3></div>
  <div id="map3d-controls">
    <button class="ctrl-btn" onclick="resetView3D()">⌖ 全体表示</button>
  </div>
</div>

<div id="timeline">
  <div id="time-display">
    <span id="time-range">GPXファイルを読み込むとタイムラインが表示されます</span>
    <span id="current-time">--:--:--</span>
  </div>
  <div id="controls">
    <button id="play-btn" title="再生/停止">▶</button>
    <select id="speed-select">
      <option value="1">×1</option><option value="10">×10</option>
      <option value="60">×60</option><option value="300" selected>×300</option>
      <option value="600">×600</option><option value="3600">×3600</option>
    </select>
    <input type="range" id="slider" min="0" max="1000" value="0" step="1">
  </div>
</div>

<div id="drop-overlay">GPXファイルをドロップ</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ================================================================
// 2D MAP (Leaflet + 国土地理院)
// ================================================================
const map2d = L.map('map2d', { zoomControl: true }).setView([36, 138], 10);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
  maxZoom: 18
}).addTo(map2d);

// ================================================================
// 3D MAP (MapLibre + 衛星画像 + 地形) — 遅延初期化
// ================================================================
let map3d = null, map3dReady = false, map3dInit = false;

function initMap3D() {
  if (map3dInit) return;
  map3dInit = true;
  const c = map2d.getCenter();

  map3d = new maplibregl.Map({
    container: 'map3d',
    style: {
      version: 8,
      glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
      sources: {
        // ESRI World Imagery（Google Earth に近い衛星画像、無料・キー不要）
        'satellite': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: 'ESRI World Imagery',
          maxzoom: 19
        },
        // ESRI 地名ラベル
        'sat-labels': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256, maxzoom: 19
        },
        'terrain-src': {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          tileSize: 256, encoding: 'terrarium', maxzoom: 15
        }
      },
      layers: [
        { id: 'satellite-layer', type: 'raster', source: 'satellite' },
        { id: 'labels-layer',    type: 'raster', source: 'sat-labels', paint:{'raster-opacity':0.8} }
      ]
    },
    center: [c.lng, c.lat],
    zoom: map2d.getZoom(),
    pitch: 55, bearing: 0, antialias: true
  });
  map3d.addControl(new maplibregl.NavigationControl(), 'top-left');

  map3d.on('load', () => {
    map3d.setTerrain({ source: 'terrain-src', exaggeration: 1.5 });

    // CP source
    map3d.addSource('cp-src', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map3d.addLayer({ id:'cp-circles', type:'circle', source:'cp-src',
      paint:{ 'circle-radius':10, 'circle-color':'rgba(255,0,0,0.45)', 'circle-stroke-color':'red', 'circle-stroke-width':2.5 }
    });
    map3d.addLayer({ id:'cp-labels', type:'symbol', source:'cp-src',
      layout:{ 'text-field':['get','name'], 'text-font':['Open Sans Bold'], 'text-size':13,
               'text-offset':[1.2,0], 'text-anchor':'left', 'text-allow-overlap':true },
      paint:{ 'text-color':'#fff', 'text-halo-color':'rgba(0,0,0,0.8)', 'text-halo-width':2 }
    });

    // ライブ追跡 source
    map3d.addSource('live-track-src', { type:'geojson', data:{ type:'Feature', geometry:{ type:'LineString', coordinates:[] } } });
    map3d.addSource('live-marker-src', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
    map3d.addLayer({ id:'live-track', type:'line', source:'live-track-src',
      layout:{ 'line-cap':'round','line-join':'round' },
      paint:{ 'line-color':'#e94560', 'line-width':4, 'line-dasharray':[2,1.5] }
    });
    map3d.addLayer({ id:'live-marker', type:'circle', source:'live-marker-src',
      paint:{ 'circle-radius':10, 'circle-color':'#e94560', 'circle-stroke-color':'white', 'circle-stroke-width':3 }
    });

    map3dReady = true;
    sync3DFromState();
    renderAtTime(currentTime);
  });
}

// ================================================================
// STATE
// ================================================================
const TEAM_COLORS = ['#00d4ff','#ff6b35','#7fff00','#ff00ff','#ffd700','#00ff99','#ff4466','#aa88ff','#ff8800','#00ffcc'];
let colorIndex = 0, teamUidCounter = 0;
let loadedFiles = [];
let globalMin = null, globalMax = null, currentTime = null;
let playing = false, animFrameId = null, lastRealTime = null;
let currentMode = '2d';

// ================================================================
// LIVETRACK360 STATE
// ================================================================
let lt360Active      = false;
let lt360GroupId     = null;
let lt360IntervalId  = null;
let lt360CurrentSecs = 0;
let lt360Pilots      = new Map(); // sn(number) -> {name, color, sn, points[], polyline2d, marker2d, uid}
let lt360DialogOpen  = false;

async function lt360Fetch(url) {
  const proxy = document.getElementById('lt360-proxy').value.trim();
  const fullUrl = proxy ? proxy + encodeURIComponent(url) : url;
  const res = await fetch(fullUrl, {cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function toggleLT360Dialog() {
  lt360DialogOpen = !lt360DialogOpen;
  document.getElementById('lt360-dialog').style.display = lt360DialogOpen ? 'block' : 'none';
}
function closeLT360Dialog() {
  lt360DialogOpen = false;
  document.getElementById('lt360-dialog').style.display = 'none';
}

function toggleLT360() {
  if(lt360Active) stopLT360(); else startLT360();
}

async function startLT360() {
  const raw = document.getElementById('lt360-input').value.trim();
  const match = raw.match(/(\d+)\/?$/);
  if(!match){ setLT360Status('グループIDが見つかりません','error'); return; }
  lt360GroupId = match[1];

  setLT360Status('接続中...','');
  document.getElementById('lt360-start-btn').textContent = '...';
  document.getElementById('lt360-start-btn').disabled = true;

  try {
    const timeData = await lt360Fetch('https://lb.flymaster.net/time.php');
    lt360CurrentSecs = Math.floor(timeData.st / 10) * 10; // align to 10-second grid
  } catch(e) {
    lt360CurrentSecs = Math.floor(Date.now()/1000 / 10) * 10;
  }

  lt360Active = true;
  document.getElementById('lt360-btn').classList.add('active');
  document.getElementById('lt360-btn').textContent = '🌐 LT360 ●';
  document.getElementById('lt360-start-btn').textContent = '⏹ 停止';
  document.getElementById('lt360-start-btn').classList.add('stop');
  document.getElementById('lt360-start-btn').disabled = false;
  document.getElementById('lt360-panel').style.display = 'block';

  await lt360Poll();
  lt360IntervalId = setInterval(lt360Poll, 10000);
}

function stopLT360() {
  if(lt360IntervalId){ clearInterval(lt360IntervalId); lt360IntervalId=null; }
  lt360Active = false;
  document.getElementById('lt360-btn').classList.remove('active');
  document.getElementById('lt360-btn').textContent = '🌐 LT360';
  document.getElementById('lt360-start-btn').textContent = '▶ 開始';
  document.getElementById('lt360-start-btn').classList.remove('stop');
  document.getElementById('lt360-panel').style.display = 'none';
  setLT360Status('停止しました','');

  // Remove map layers
  lt360Pilots.forEach(p=>{
    if(p.polyline2d) { map2d.removeLayer(p.polyline2d); }
    if(p.marker2d && map2d.hasLayer(p.marker2d)) { map2d.removeLayer(p.marker2d); }
    remove3DTeam(p.uid);
  });
  lt360Pilots.clear();
  updateLegend();
}

async function lt360Poll() {
  try {
    const t = Math.floor(Date.now()/1000);
    // plist から現在位置・パイロット情報を取得（lb.flymaster.net は CORS 対応・認証不要）
    const pdata = await lt360Fetch(
      `https://lb.flymaster.net/getlivedatam.php?grp=${lt360GroupId}&d=${t}&plist=1`
    );
    if(!pdata || !pdata.plist) {
      setLT360Status('データなし（グループが存在しないか未アクティブ）','');
      return;
    }

    const now = new Date();
    let updated = 0;

    pdata.plist.forEach(p => {
      const sn  = parseInt(p.sn);
      const lat = parseFloat(p.a);
      const lng = parseFloat(p.o);
      const alt = parseFloat(p.h) || 0;
      const spd = parseFloat(p.v) || 0;
      const ts  = p.d ? new Date(parseInt(p.d)*1000) : now;
      if(isNaN(lat)||isNaN(lng)||lat===0&&lng===0) return;

      // 新規パイロット登録
      if(!lt360Pilots.has(sn)){
        const color = TEAM_COLORS[colorIndex%TEAM_COLORS.length]; colorIndex++;
        const uid   = teamUidCounter++;
        const poly  = L.polyline([],{color,weight:3,opacity:0.85}).addTo(map2d);
        const mkr   = L.circleMarker([lat,lng],{radius:7,color:'white',fillColor:color,fillOpacity:1,weight:2});
        lt360Pilots.set(sn,{name:p.nm||`Pilot ${sn}`, color, sn, uid, points:[], polyline2d:poly, marker2d:mkr, lastD:0});
      }

      const pilot = lt360Pilots.get(sn);
      if(p.nm) pilot.name = p.nm;

      // 前回と異なるタイムスタンプのときだけ点を追加（重複防止）
      const dTimestamp = parseInt(p.d)||0;
      if(dTimestamp > pilot.lastD){
        pilot.lastD = dTimestamp;
        pilot.points.push({lat, lng, ele:alt, spd, time:ts});
        updated++;
      }

      // 2D マップ更新
      if(pilot.points.length>0){
        pilot.polyline2d.setLatLngs(pilot.points.map(q=>[q.lat,q.lng]));
        pilot.marker2d.setLatLng([lat,lng]);
        if(!map2d.hasLayer(pilot.marker2d)) pilot.marker2d.addTo(map2d);
      }

      // 3D マップ更新
      if(map3d&&map3dReady) lt360Update3D(pilot);
    });

    const cnt = lt360Pilots.size;
    setLT360Status(`<b>${cnt}</b> 名追跡中 ● ${fmt(now)}`,'ok');
    document.getElementById('lt360-panel-info').innerHTML =
      `グループ <b>${lt360GroupId}</b><br>追跡: <b>${cnt}</b> 名<br>${fmt(now)}`;
    updateLegend();

    // 初回のみ範囲に合わせる
    if(lt360CurrentSecs===0 && cnt>0){
      lt360CurrentSecs=1;
      const coords=[]; lt360Pilots.forEach(p=>coords.push([p.points[p.points.length-1].lat, p.points[p.points.length-1].lng]));
      if(coords.length>0 && currentMode==='2d'){
        const lats=coords.map(c=>c[0]),lngs=coords.map(c=>c[1]);
        map2d.fitBounds([[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]],{padding:[60,60]});
      }
    }

  } catch(e) {
    console.error('LT360 error:', e);
    const isCors = e instanceof TypeError;
    setLT360Status(
      isCors ? '⚠ CORS エラー。プロキシURLを入力し python3 proxy.py を起動してください'
             : `エラー: ${e.message}`,
      'error'
    );
  }
}

function lt360Update3D(pilot) {
  const tid=`track-${pilot.uid}`, mid=`marker-${pilot.uid}`;
  if(!map3d.getSource(tid)){
    try{
      map3d.addSource(tid,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[[0,0],[0,0]]}}});
      map3d.addLayer({id:tid,type:'line',source:tid,layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':pilot.color,'line-width':3.5,'line-opacity':0.92}},'cp-circles');
    }catch(e){}
    try{
      map3d.addSource(mid,{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map3d.addLayer({id:mid,type:'circle',source:mid,
        paint:{'circle-radius':8,'circle-color':pilot.color,'circle-stroke-color':'white','circle-stroke-width':2.5}});
    }catch(e){}
  }
  try{
    const coords=pilot.points.map(q=>[q.lng,q.lat]);
    if(map3d.getSource(tid)) map3d.getSource(tid).setData({type:'Feature',geometry:{type:'LineString',coordinates:coords.length>=2?coords:[[0,0],[0,0]]}});
    if(map3d.getSource(mid)){
      const lp=pilot.points[pilot.points.length-1];
      map3d.getSource(mid).setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[lp.lng,lp.lat]},properties:{}}]});
    }
  }catch(e){}
}

// ================================================================
// LIVE TRACKING STATE
// ================================================================
let liveActive    = false;
let liveWatchId   = null;
let livePoints    = [];   // {lat, lng, time, ele, acc}
let livePolyline2D  = null;
let liveMarker2D    = null;

// ================================================================
// GPX PARSING
// ================================================================
function parseGPX(text) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'application/xml');
  const cpPoints = [];
  const getEls = (p,t) => Array.from(p.getElementsByTagNameNS('*',t));
  const getText = (p,t) => { const e=p.getElementsByTagNameNS('*',t)[0]; return e?e.textContent.trim():''; };

  getEls(doc,'wpt').forEach(el => {
    const lat=parseFloat(el.getAttribute('lat')), lng=parseFloat(el.getAttribute('lon'));
    if(isNaN(lat)||isNaN(lng)) return;
    cpPoints.push({ lat, lng, name: getText(el,'ident')||getText(el,'name')||getText(el,'desc')||'' });
  });
  getEls(doc,'rte').forEach(rte => getEls(rte,'rtept').forEach(el => {
    const lat=parseFloat(el.getAttribute('lat')), lng=parseFloat(el.getAttribute('lon'));
    if(isNaN(lat)||isNaN(lng)) return;
    cpPoints.push({ lat, lng, name: getText(el,'ident')||getText(el,'name')||getText(el,'desc')||'' });
  }));
  const tracks = [];
  getEls(doc,'trk').forEach(trk => {
    const trkName=getText(trk,'name')||'';
    const points=[];
    getEls(trk,'trkpt').forEach(pt => {
      const lat=parseFloat(pt.getAttribute('lat')), lng=parseFloat(pt.getAttribute('lon'));
      if(isNaN(lat)||isNaN(lng)) return;
      const tEl=pt.getElementsByTagNameNS('*','time')[0], eEl=pt.getElementsByTagNameNS('*','ele')[0];
      points.push({ lat, lng, time:tEl?new Date(tEl.textContent):null, ele:eEl?parseFloat(eEl.textContent):null });
    });
    if(points.length>0) tracks.push({ name:trkName, points });
  });
  return { cpPoints, tracks };
}

// ================================================================
// ELEVATION
// ================================================================
function calcElevGain(pts, thr=5) {
  let gain=0, base=null;
  for(const p of pts) {
    if(p.ele==null||isNaN(p.ele)) continue;
    if(base===null){base=p.ele;continue;}
    const d=p.ele-base;
    if(d>=thr){gain+=d;base=p.ele;} else if(d<0){base=p.ele;}
  }
  return Math.round(gain);
}

// ================================================================
// 2D CP MARKERS (Leaflet)
// ================================================================
function createCPMarker2D(pt) {
  const g = L.layerGroup();
  L.circleMarker([pt.lat,pt.lng],{radius:10,color:'red',weight:2,fillColor:'red',fillOpacity:0.35,opacity:0.9}).addTo(g);
  if(pt.name) L.marker([pt.lat,pt.lng],{ icon:L.divIcon({ className:'',
    html:`<div style="position:absolute;transform:translate(12px,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:2px 7px;border-radius:3px;font-size:12px;white-space:nowrap;border:1px solid red;pointer-events:none">${pt.name}</div>`,
    iconSize:[0,0], iconAnchor:[0,0] })}).addTo(g);
  return g;
}

// ================================================================
// FILE MANAGEMENT
// ================================================================
function addParsedFile(filename, parsed) {
  const fileId = Date.now()+Math.random();
  const entry  = { id:fileId, name:filename.replace(/\.gpx$/i,''), cpPoints:parsed.cpPoints, cpLayers:[], teams:[] };

  parsed.cpPoints.forEach(pt => { const l=createCPMarker2D(pt); l.addTo(map2d); entry.cpLayers.push(l); });

  parsed.tracks.forEach((trk,i) => {
    const color = TEAM_COLORS[colorIndex%TEAM_COLORS.length]; colorIndex++;
    const uid   = teamUidCounter++;
    const polyline     = L.polyline([],{color,weight:3,opacity:0.85}).addTo(map2d);
    const markerLayer  = L.circleMarker([0,0],{radius:7,color:'white',fillColor:color,fillOpacity:1,weight:2});
    const teamName     = trk.name||(parsed.tracks.length===1?entry.name:`${entry.name} #${i+1}`);
    const hasEle       = trk.points.some(p=>p.ele!=null&&!isNaN(p.ele));
    entry.teams.push({ uid, name:teamName, color, points:trk.points, polyline, markerLayer, hasEle });
  });
  loadedFiles.push(entry);
  if(currentMode==='3d'&&map3d&&map3dReady) sync3DFromState();
  recalcTimeRange(); updateLegend(); updateFileList();

  const bounds=[];
  loadedFiles.forEach(f=>{ f.teams.forEach(t=>t.points.forEach(p=>bounds.push([p.lat,p.lng]))); f.cpPoints.forEach(p=>bounds.push([p.lat,p.lng])); });
  if(bounds.length>0) {
    if(currentMode==='2d') map2d.fitBounds(bounds,{padding:[30,30]});
    else if(map3d&&map3dReady) { const lngs=bounds.map(b=>b[1]),lats=bounds.map(b=>b[0]); map3d.fitBounds([[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],{padding:40}); }
  }
  renderAtTime(currentTime);
}

function removeTeam(fileId, teamName) {
  const f=loadedFiles.find(f=>f.id===fileId); if(!f) return;
  const idx=f.teams.findIndex(t=>t.name===teamName); if(idx===-1) return;
  const t=f.teams[idx];
  map2d.removeLayer(t.polyline); if(map2d.hasLayer(t.markerLayer)) map2d.removeLayer(t.markerLayer);
  remove3DTeam(t.uid); f.teams.splice(idx,1);
  if(f.teams.length===0&&f.cpLayers.length===0) loadedFiles.splice(loadedFiles.indexOf(f),1);
  recalcTimeRange(); updateLegend(); updateFileList(); renderAtTime(currentTime);
}
function removeFile(fileId) {
  const idx=loadedFiles.findIndex(f=>f.id===fileId); if(idx===-1) return;
  const f=loadedFiles[idx];
  f.cpLayers.forEach(l=>map2d.removeLayer(l));
  f.teams.forEach(t=>{ map2d.removeLayer(t.polyline); if(map2d.hasLayer(t.markerLayer)) map2d.removeLayer(t.markerLayer); remove3DTeam(t.uid); });
  loadedFiles.splice(idx,1);
  if(map3d&&map3dReady) update3DCPs();
  recalcTimeRange(); updateLegend(); updateFileList(); renderAtTime(currentTime);
}

// ================================================================
// 3D HELPERS
// ================================================================
function remove3DTeam(uid) {
  if(!map3d||!map3dReady) return;
  [`track-${uid}`,`marker-${uid}`].forEach(id=>{
    try{ if(map3d.getLayer(id)) map3d.removeLayer(id); }catch(e){}
    try{ if(map3d.getSource(id)) map3d.removeSource(id); }catch(e){}
  });
}
function sync3DFromState() {
  if(!map3d||!map3dReady) return;
  update3DCPs();
  loadedFiles.forEach(f=>f.teams.forEach(t=>{
    const tid=`track-${t.uid}`, mid=`marker-${t.uid}`;
    if(!map3d.getSource(tid)){
      try{
        map3d.addSource(tid,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[[0,0],[0,0]]}}});
        map3d.addLayer({id:tid,type:'line',source:tid,layout:{'line-cap':'round','line-join':'round'},
          paint:{'line-color':t.color,'line-width':3.5,'line-opacity':0.92}}, 'cp-circles');
      }catch(e){console.warn(e);}
      try{
        map3d.addSource(mid,{type:'geojson',data:{type:'FeatureCollection',features:[]}});
        map3d.addLayer({id:mid,type:'circle',source:mid,
          paint:{'circle-radius':8,'circle-color':t.color,'circle-stroke-color':'white','circle-stroke-width':2.5}});
      }catch(e){console.warn(e);}
    }
  }));
}
function update3DCPs() {
  if(!map3d||!map3dReady||!map3d.getSource('cp-src')) return;
  map3d.getSource('cp-src').setData({ type:'FeatureCollection',
    features: loadedFiles.flatMap(f=>f.cpPoints.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat]},properties:{name:p.name||''}})))
  });
}

// ================================================================
// TIME RANGE
// ================================================================
function recalcTimeRange() {
  globalMin=null; globalMax=null;
  loadedFiles.forEach(f=>f.teams.forEach(t=>t.points.forEach(p=>{
    if(!p.time||isNaN(p.time)) return;
    if(!globalMin||p.time<globalMin) globalMin=p.time;
    if(!globalMax||p.time>globalMax) globalMax=p.time;
  })));
  if(globalMin&&globalMax){
    currentTime=currentTime?new Date(Math.min(Math.max(+currentTime,+globalMin),+globalMax)):new Date(globalMin);
    document.getElementById('time-range').textContent=`${fmt(globalMin)} 〜 ${fmt(globalMax)}`;
    document.getElementById('slider').value=((currentTime-globalMin)/(globalMax-globalMin))*1000;
  } else {
    currentTime=null;
    document.getElementById('time-range').textContent='GPXファイルを読み込むとタイムラインが表示されます';
    document.getElementById('current-time').textContent='--:--:--';
  }
}
function fmt(d){ if(!d) return '--'; return d.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

// ================================================================
// RENDER AT TIME
// ================================================================
function renderAtTime(t) {
  if(!t||!globalMin||!globalMax) return;
  document.getElementById('current-time').textContent = fmt(t);
  const elevData=[];
  loadedFiles.forEach(f=>f.teams.forEach(team=>{
    const pts=team.points.filter(p=>p.time&&!isNaN(p.time)&&p.time<=t);
    // 2D
    if(pts.length===0){ team.polyline.setLatLngs([]); if(map2d.hasLayer(team.markerLayer)) map2d.removeLayer(team.markerLayer); }
    else {
      team.polyline.setLatLngs(pts.map(p=>[p.lat,p.lng]));
      const last=pts[pts.length-1];
      team.markerLayer.setLatLng([last.lat,last.lng]);
      if(!map2d.hasLayer(team.markerLayer)) team.markerLayer.addTo(map2d);
    }
    // 3D
    if(currentMode==='3d'&&map3d&&map3dReady){
      const tid=`track-${team.uid}`, mid=`marker-${team.uid}`;
      try{
        if(map3d.getSource(tid)) map3d.getSource(tid).setData({type:'Feature',geometry:{type:'LineString',coordinates:pts.length>=2?pts.map(p=>[p.lng,p.lat]):[[0,0],[0,0]]}});
        if(map3d.getSource(mid)) map3d.getSource(mid).setData({type:'FeatureCollection',features:pts.length>0?[{type:'Feature',geometry:{type:'Point',coordinates:[pts[pts.length-1].lng,pts[pts.length-1].lat]},properties:{}}]:[]});
      }catch(e){}
    }
    if(team.hasEle){
      const last=pts[pts.length-1];
      elevData.push({name:team.name,color:team.color,ele:last?last.ele:null,gain:pts.length>0?calcElevGain(pts):0});
    }
  }));
  // ライブの標高もあれば追加
  if(liveActive&&livePoints.length>0){
    const last=livePoints[livePoints.length-1];
    if(last.ele!=null) elevData.push({name:'現在地',color:'#e94560',ele:last.ele,gain:calcElevGain(livePoints)});
  }
  updateElevPanel(elevData);
}

// ================================================================
// ELEVATION PANEL
// ================================================================
function updateElevPanel(data) {
  const panel=document.getElementById('elev-panel'), rows=document.getElementById('elev-rows');
  if(data.length===0){panel.style.display='none';return;}
  panel.style.display='block'; rows.innerHTML='';
  data.forEach(d=>{
    const row=document.createElement('div'); row.className='elev-row';
    row.innerHTML=`<div class="elev-dot" style="background:${d.color}"></div><div class="elev-name">${d.name}</div><div class="elev-vals">${d.ele!=null&&!isNaN(d.ele)?`<span>${Math.round(d.ele)}</span>m`:'<span>--</span>'} &nbsp; <span class="gain">+${d.gain}</span>m</div>`;
    rows.appendChild(row);
  });
}

// ================================================================
// LIVE TRACKING
// ================================================================
function toggleLive() {
  if(liveActive) stopLive(); else startLive();
}

function startLive() {
  if(!navigator.geolocation){ alert('このブラウザはGeolocationに対応していません'); return; }
  liveActive=true; livePoints=[];
  document.getElementById('live-btn').classList.add('active');
  document.getElementById('live-btn').textContent='⏹ ライブ停止';
  document.getElementById('live-panel').style.display='block';
  document.getElementById('live-info').textContent='GPS取得中...';
  document.getElementById('play-btn').disabled=true;
  document.getElementById('slider').disabled=true;

  // 2D レイヤー
  livePolyline2D = L.polyline([],{color:'#e94560',weight:4,opacity:0.9,dashArray:'8,4'}).addTo(map2d);
  liveMarker2D   = L.circleMarker([0,0],{radius:10,color:'white',fillColor:'#e94560',fillOpacity:1,weight:3});

  liveWatchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat, longitude:lng, altitude:ele, accuracy:acc, speed} = pos.coords;
    const time = new Date(pos.timestamp);
    livePoints.push({lat, lng, time, ele:ele??null, acc});

    // 2D更新
    livePolyline2D.setLatLngs(livePoints.map(p=>[p.lat,p.lng]));
    liveMarker2D.setLatLng([lat,lng]);
    if(!map2d.hasLayer(liveMarker2D)) liveMarker2D.addTo(map2d);
    if(currentMode==='2d') map2d.panTo([lat,lng]);

    // 3D更新
    if(map3d&&map3dReady){
      try{
        if(map3d.getSource('live-track-src'))
          map3d.getSource('live-track-src').setData({type:'Feature',geometry:{type:'LineString',coordinates:livePoints.length>=2?livePoints.map(p=>[p.lng,p.lat]):[[0,0],[0,0]]}});
        if(map3d.getSource('live-marker-src'))
          map3d.getSource('live-marker-src').setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{}}]});
        if(currentMode==='3d') map3d.panTo([lng,lat]);
      }catch(e){}
    }

    // 情報パネル更新
    const spd = speed!=null ? `${(speed*3.6).toFixed(1)} km/h` : '--';
    const eleStr = ele!=null ? `${Math.round(ele)} m` : '--';
    document.getElementById('live-info').innerHTML=
      `<b>緯度</b> ${lat.toFixed(5)}<br><b>経度</b> ${lng.toFixed(5)}<br><b>標高</b> ${eleStr}<br><b>速度</b> ${spd}<br><b>精度</b> ±${Math.round(acc)} m<br><b>時刻</b> ${fmt(time)}`;
    document.getElementById('current-time').textContent = fmt(time);
    updateElevPanel(buildElevData(null));
    updateLegend();
  }, err=>{
    document.getElementById('live-info').innerHTML=`<span style="color:#e74c3c">エラー: ${err.message}</span>`;
  }, { enableHighAccuracy:true, maximumAge:3000, timeout:10000 });
}

function stopLive() {
  if(liveWatchId) navigator.geolocation.clearWatch(liveWatchId);
  liveWatchId=null; liveActive=false;
  document.getElementById('live-btn').classList.remove('active');
  document.getElementById('live-btn').textContent='📍 ライブ';
  document.getElementById('live-panel').style.display='none';
  document.getElementById('play-btn').disabled=false;
  document.getElementById('slider').disabled=false;
  if(livePolyline2D){ map2d.removeLayer(livePolyline2D); livePolyline2D=null; }
  if(liveMarker2D&&map2d.hasLayer(liveMarker2D)){ map2d.removeLayer(liveMarker2D); liveMarker2D=null; }
  if(map3d&&map3dReady){
    try{
      map3d.getSource('live-track-src')?.setData({type:'Feature',geometry:{type:'LineString',coordinates:[]}});
      map3d.getSource('live-marker-src')?.setData({type:'FeatureCollection',features:[]});
    }catch(e){}
  }
  updateLegend();
}

function buildElevData(t) {
  const elevData=[];
  if(t) loadedFiles.forEach(f=>f.teams.forEach(team=>{
    if(!team.hasEle) return;
    const pts=team.points.filter(p=>p.time&&!isNaN(p.time)&&p.time<=t);
    if(pts.length>0) elevData.push({name:team.name,color:team.color,ele:pts[pts.length-1].ele,gain:calcElevGain(pts)});
  }));
  if(liveActive&&livePoints.length>0){
    const last=livePoints[livePoints.length-1];
    if(last.ele!=null) elevData.push({name:'現在地',color:'#e94560',ele:last.ele,gain:calcElevGain(livePoints)});
  }
  return elevData;
}

function toggleMode() {
  if(currentMode==='2d') switchTo3D(); else switchTo2D();
}

  document.getElementById('mode-btn').textContent='🗺 2D地図';

function switchTo2D() {

function resetView3D() {
  if(!map3d) return;
  const bounds=[];
  loadedFiles.forEach(f=>{ f.teams.forEach(t=>t.points.forEach(p=>bounds.push([p.lng,p.lat]))); f.cpPoints.forEach(p=>bounds.push([p.lng,p.lat])); });
  livePoints.forEach(p=>bounds.push([p.lng,p.lat]));
  if(bounds.length===0) return;
  const lngs=bounds.map(b=>b[0]),lats=bounds.map(b=>b[1]);
  map3d.fitBounds([[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],{padding:60,pitch:55,duration:800});
}

// ================================================================
// PLAYBACK
// ================================================================
function startPlay() {
  if(!globalMin||!globalMax) return;
  playing=true; document.getElementById('play-btn').textContent='⏸';
  lastRealTime=performance.now();
  function tick(){
    if(!playing) return;
    const now=performance.now(), delta=(now-lastRealTime)/1000; lastRealTime=now;
    const speed=parseInt(document.getElementById('speed-select').value);
    currentTime=new Date(currentTime.getTime()+delta*speed*1000);
    if(currentTime>=globalMax){ currentTime=new Date(globalMax); playing=false; document.getElementById('play-btn').textContent='▶'; }
    document.getElementById('slider').value=((currentTime-globalMin)/(globalMax-globalMin))*1000;
    renderAtTime(currentTime);
    if(playing) animFrameId=requestAnimationFrame(tick);
  }
  animFrameId=requestAnimationFrame(tick);
}
function stopPlay(){ playing=false; document.getElementById('play-btn').textContent='▶'; if(animFrameId) cancelAnimationFrame(animFrameId); }
document.getElementById('play-btn').addEventListener('click',()=>{ if(playing) stopPlay(); else{ if(currentTime&&globalMax&&currentTime>=globalMax) currentTime=new Date(globalMin); startPlay(); } });
document.getElementById('slider').addEventListener('input',e=>{ if(!globalMin||!globalMax) return; stopPlay(); currentTime=new Date(globalMin.getTime()+(e.target.value/1000)*(globalMax-globalMin)); renderAtTime(currentTime); });

      +(t.fileId!=null?`<span class="team-remove" data-file-id="${t.fileId}" data-team-name="${t.name}" style="cursor:pointer;opacity:0.5;font-size:13px;flex-shrink:0" title="削除">✕</span>`:'');

// ================================================================
// FILE LOADING
// ================================================================
function loadFiles(files){
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const parsed=parseGPX(e.target.result);
      if(parsed.cpPoints.length===0&&parsed.tracks.length===0){alert(`${file.name}: 有効なポイントが見つかりませんでした`);return;}
      addParsedFile(file.name,parsed);
    };
    reader.readAsText(file);
  });
}
document.getElementById('file-input').addEventListener('change',e=>{loadFiles(e.target.files);e.target.value='';});
document.addEventListener('dragover',e=>{e.preventDefault();document.getElementById('drop-overlay').classList.add('active');});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.getElementById('drop-overlay').classList.remove('active');});
document.addEventListener('drop',e=>{e.preventDefault();document.getElementById('drop-overlay').classList.remove('active');const gpx=Array.from(e.dataTransfer.files).filter(f=>f.name.toLowerCase().endsWith('.gpx'));if(gpx.length>0)loadFiles(gpx);});

// ================================================================
// DEMO DATA
// ================================================================
function loadDemoData(){
  const base=new Date('2025-06-01T06:00:00Z');
  const cpPoints=[{lat:35.680,lng:138.550,name:'START'},{lat:35.700,lng:138.580,name:'CP1'},{lat:35.720,lng:138.560,name:'CP2'},{lat:35.710,lng:138.530,name:'CP3'},{lat:35.690,lng:138.510,name:'FINISH'}];
  const eleProfile=[800,950,1100,1020,880];
  const tracks=['Team Alpha','Team Beta','Team Gamma'].map((name,ti)=>{
    const pts=[];
    for(let i=0;i<cpPoints.length-1;i++){
      const steps=30+Math.floor(Math.random()*20);
      for(let s=0;s<=steps;s++){
        const r=s/steps,j=0.002;
        pts.push({lat:cpPoints[i].lat+(cpPoints[i+1].lat-cpPoints[i].lat)*r+(Math.random()-.5)*j,lng:cpPoints[i].lng+(cpPoints[i+1].lng-cpPoints[i].lng)*r+(Math.random()-.5)*j,time:new Date(base.getTime()+(ti*600+(i*35+s)*180+Math.random()*60)*1000),ele:eleProfile[i]+(eleProfile[i+1]-eleProfile[i])*r+(Math.random()-.5)*20});
      }
    }
    return {name,points:pts};
  });
  addParsedFile('Demo.gpx',{cpPoints,tracks});
}

loadDemoData();
</script>
